<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Galerie WebGL mixte images / vidéos avec effet magnet au survol." />
    <title>Ismael Nebchi — Galerie</title>
  </head>
  <body>
    <div id="app">
      <header class="site-header">
        <img class="site-mark" src="/logo-picto.svg" alt="Ismael Nebchi" />
        <span class="site-subtitle">Selected&nbsp;Works</span>
        <button class="overview-toggle" id="overview-toggle" type="button" aria-label="Changer de vue" data-mode="grid">
          <span class="overview-toggle-icon overview-toggle-icon--grid">
            <span></span><span></span><span></span><span></span>
          </span>
          <span class="overview-toggle-icon overview-toggle-icon--lines">
            <span></span><span></span><span></span>
          </span>
          <span class="overview-toggle-icon overview-toggle-icon--cube">
            <span></span>
          </span>
        </button>
      </header>

      <div class="scroll-hint" id="scroll-hint" aria-hidden="true">
        <span></span>
        Scroll
      </div>

      <div class="fulltext-view" id="fulltext-view" aria-hidden="true">
        <div class="fulltext-list" id="fulltext-list"></div>
      </div>

    </div>

    <div class="fulltext-preview" id="fulltext-preview" aria-hidden="true">
      <img class="fulltext-preview-media" id="fulltext-preview-img" alt="" />
      <video class="fulltext-preview-media" id="fulltext-preview-video" muted loop playsinline></video>
    </div>

    <!-- 4th view mode: scroll-driven 3D carousel per project (GSAP
         ScrollSmoother/ScrollTrigger/SplitText), fully self-contained with
         its own fixed wrapper/content so it never fights the WebGL modes'
         window-scroll — see Carousel3DView.js. Scenes are built at runtime
         from galleryData.js, not hardcoded here. -->
    <div class="carousel3d-view" id="carousel3d-view" aria-hidden="true">
      <div class="c3d-wrapper" id="c3d-wrapper">
        <div class="c3d-content" id="c3d-content">
          <div class="c3d-scene-wrapper" id="c3d-scene-wrapper"></div>
        </div>
      </div>
    </div>

    <div class="project-page" id="project-page">
      <div class="project-topbar">
        <a href="#" class="project-back" id="project-back">← Selected Works</a>
        <div class="project-meta">
          <span class="project-meta-title" id="project-title"></span>
          <span class="project-meta-client" id="project-client"></span>
          <span class="project-meta-year" id="project-year"></span>
        </div>
      </div>
      <div class="project-hero-slot" id="project-hero-slot"></div>
      <div class="project-body" id="project-body"></div>
    </div>

    <footer class="site-footer">
      <nav class="footer-nav">
        <a href="#app">Selected Works</a>
        <a href="mailto:hello@ismaelnebchi.com">Contact</a>
        <a href="#app">Instagram</a>
        <a href="#app">Are.na</a>
      </nav>

      <div class="footer-bottom">
        <span>© 2026 Ismael Nebchi. Tous droits réservés.</span>
        <span>Édition N°01 — Galerie</span>
      </div>

      <div class="footer-wordmark">
        <img src="/footer-wordmark.svg" alt="Ismael Nebchi" />
      </div>
    </footer>
